<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#e11d48">
<meta name="description" content="Menu and prices of The Paradise Juice Bar. Order on WhatsApp.">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="site.webmanifest">
<!-- BUILD:HEAD -->
<title>The Paradise Juice Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap" onload="this.onload=null;this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap"></noscript>
<!-- /BUILD:HEAD -->
<link rel="stylesheet" href="styles.css">
</head>
<body>
<!-- BUILD:BODY -->
<div class="app">
  <header class="top">
    <div class="brand">
      <div class="logo" aria-hidden="true"><span id="logoText">JB</span></div>
      <div class="brand-text">
        <h1 id="shopName">Juice Bar</h1>
        <p class="tagline" id="shopTagline"></p>
      </div>
    </div>
    <div class="meta-row">
      <span class="status" id="openStatus"></span>
      <span class="table-chip" id="tableChip" hidden></span>
    </div>
    <p class="notice" id="notice" hidden></p>
    <label class="search" for="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="search" type="search" placeholder="Search drinks or ingredients" autocomplete="off" enterkeyhint="search">
    </label>
  </header>

  <section class="specials" id="specials" aria-label="Today's specials"></section>

  <div class="goals" id="goals" role="group" aria-label="Filter by health goal"></div>

  <nav class="cats" id="cats" aria-label="Menu categories"></nav>

  <main id="menu"></main>

  <div class="empty" id="empty" hidden>
    <p class="empty-title">No drinks match</p>
    <p>Try another word, or clear the filter.</p>
    <button type="button" class="btn-ghost" id="clearFilters">Clear search and filter</button>
  </div>

  <footer class="foot" id="foot"></footer>

  <p class="credit" id="credit" hidden></p>
</div>

<!-- Bottom-right thumb zone -->
<div class="fabs">
  <div class="dial" id="dial" hidden></div>
  <div class="fab-row">
    <button type="button" class="fab-cart" id="cartBtn" hidden aria-label="View your order">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 8h12l-1 12H7L6 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>
      <span class="count" id="cartCount">0</span>
      <span class="cart-total" id="cartTotal"></span>
    </button>
    <button type="button" class="fab-menu" id="menuBtn" aria-expanded="false" aria-controls="dial" aria-label="Jump to a category">
      <svg class="i-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
      <svg class="i-close" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
      <span class="fab-label">Menu</span>
    </button>
  </div>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="productSheet" role="dialog" aria-modal="true" aria-labelledby="psName" hidden></section>

<section class="sheet" id="cartSheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle" hidden></section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<!-- /BUILD:BODY -->
<script src="menu.js"></script>
<script src="app.js"></script>
</body>
</html>
